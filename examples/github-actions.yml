name: LET Daily Sync CI/CD

on:
  workflow_dispatch:
    inputs:
      run_spectral:
        description: "Use spectral path"
        required: false
        default: "false"
  schedule:
    # Runs daily at 09:00 UTC
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 openpyxl pandas flask
          fi

      - name: Run sync
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MAX_MESSAGES_PER_RUN: "5"
          DISCORD_RATE_LIMIT_SECONDS: "0.25"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
          TZ: UTC
        run: |
          if [ "${{ github.event.inputs.run_spectral }}" = "true" ]; then
            python workflows/auto_sync.py --force-spectral
          else
            python workflows/auto_sync.py
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: let-automation-output
          path: |
            output/**/*.xlsx
            output/**/*.json
            ~/.let-automation/log/*.md

      - name: Run tests (smoke)
        run: |
          PYTHONPATH=. pytest -q tests/test_email.py tests/test_discord.py tests/test_ml_extractor.py
